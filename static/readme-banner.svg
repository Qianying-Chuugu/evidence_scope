<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">EvidenceScope</title>
  <desc id="desc">A document, search lens, and connected evidence cards on a dark blue background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#091827"/>
      <stop offset="1" stop-color="#12384b"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#63e8c5"/>
      <stop offset="1" stop-color="#49b8e8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#1f9da8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#1f9da8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#03101b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
